<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Наша Галлерея пупупу</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(170deg,#1b1640 0%,#3a2366 45%,#7a3a78 80%,#c4637e 100%) fixed;color:#fff;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 48px}
h1{margin:12px 0 36px;text-align:center;font-size:clamp(30px,6vw,56px);font-weight:800;letter-spacing:.5px;text-shadow:0 3px 0 #a33a6a,0 8px 24px rgba(0,0,0,.35)}
h1 span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px) scale(1.05)}90%{transform:translateY(0) scale(.97)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);gap:20px}}
a.card{display:block;background:#fff8ee;color:#4a2a4a;text-decoration:none;padding:10px 10px 14px;border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.35);transform:rotate(var(--r));transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
a.card:hover,a.card:focus-visible{transform:rotate(0) translateY(-8px) scale(1.04);box-shadow:0 18px 40px rgba(0,0,0,.45);outline:none}
a.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:#222}
.cap{margin-top:10px;text-align:center;font-weight:800;font-size:clamp(15px,2vw,19px)}
.date{display:block;margin-top:2px;font-size:12px;font-weight:600;color:#9a7a8a}
footer{margin-top:44px;text-align:center;font-size:14px;opacity:.75}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
<h1><span>Наша Галлерея пупупу</span> 💕</h1>
<div class="grid">
<a class="card" style="--r:-2deg" href="ana/"><img src="img/ana.webp" alt=""><div class="cap">Расшифруй<span class="date">15.06.2026</span></div></a>
<a class="card" style="--r:1.5deg" href="ana-sky/"><img src="img/ana-sky.webp" alt=""><div class="cap">Наше небо<span class="date">16.06.2026</span></div></a>
<a class="card" style="--r:-1deg" href="walle/"><img src="img/walle.webp" alt=""><div class="cap">ВАЛЛ·И и ЕВА<span class="date">16.06.2026</span></div></a>
<a class="card" style="--r:2deg" href="serdce/"><img src="img/serdce.webp" alt=""><div class="cap">Сердце<span class="date">03.07.2026</span></div></a>
<a class="card" style="--r:1deg" href="lego/"><img src="img/lego.webp" alt=""><div class="cap">Собери нас<span class="date">16.07.2026</span></div></a>
<a class="card" style="--r:-2deg" href="dexter/"><img src="img/dexter.webp" alt=""><div class="cap">Декстер<span class="date">06.08.2026</span></div></a>
<a class="card" style="--r:1.5deg" href="kushat/"><img src="img/kushat.webp" alt=""><div class="cap">Ам-ням<span class="date">05.10.2026</span></div></a>
</div>
<footer>и это только начало ✨</footer>
</main>
<script>
const cv = document.getElementById('sky'), c = cv.getContext('2d');
let W, H, stars = [], hearts = [];
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; c.setTransform(d, 0, 0, d, 0, 0);
  stars = Array.from({ length: Math.round(W * H / 6000) }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.8, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6 }));
}
function heart(x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * 0.35);
  c.bezierCurveTo(x - s * 1.05, y - s * 0.35, x - s * 0.5, y - s * 1.1, x, y - s * 0.45);
  c.bezierCurveTo(x + s * 0.5, y - s * 1.1, x + s * 1.05, y - s * 0.35, x, y + s * 0.35);
  c.fill();
}
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  c.clearRect(0, 0, W, H);
  for (const s of stars) { c.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.8 + s.p)); c.fillStyle = '#fff'; c.beginPath(); c.arc(s.x, s.y, s.r, 0, 7); c.fill(); }
  if (hearts.length < 14 && Math.random() < dt * 1.2) hearts.push({ x: Math.random() * W, y: H + 20, s: 6 + Math.random() * 10, v: 20 + Math.random() * 30, p: Math.random() * 6 });
  for (const h of hearts) { h.y -= h.v * dt; c.globalAlpha = Math.min(0.45, h.y / H); c.fillStyle = '#ff8fb3'; heart(h.x + Math.sin(t + h.p) * 12, h.y, h.s); }
  hearts = hearts.filter(h => h.y > -30);
  c.globalAlpha = 1;
  if (!still) requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
